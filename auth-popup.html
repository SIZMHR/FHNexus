<!DOCTYPE html>
<html>
<head><title>認証中...</title></head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:40vh;color:#666;">認証処理中です。このウィンドウは自動的に閉じます...</p>
<script src="msal-browser.min.js"></script>
<script>
    // このページはMSALのポップアップ認証コールバック専用です。
    // Microsoft ログインからリダイレクトされた後、認証結果を親ウィンドウに渡して自動的に閉じます。
    const msalConfig = {
        auth: {
            clientId: '070cbac7-3990-49af-960c-26fb77a48cfd',
            authority: 'https://login.microsoftonline.com/17a5182f-d27f-4a41-9015-3a1e248cb0fd',
            redirectUri: window.location.origin + '/auth-popup.html'
        },
        cache: {
            cacheLocation: 'sessionStorage'
        }
    };
    const msalApp = new msal.PublicClientApplication(msalConfig);
    msalApp.initialize().then(() => {
        return msalApp.handleRedirectPromise();
    }).then(response => {
        if (response) {
            console.log("Auth popup: redirect handled successfully");
        }
    }).catch(err => {
        console.error("Auth popup error:", err);
    });
</script>
</body>
</html>
